services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agentic-learning-platform:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/ready', timeout=2).status == 200 else sys.exit(1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
