[project]
name = "agentic-learning-platform"
version = "0.1.0"
description = "AI Learning Assistant backend foundation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "docling>=2.14.0",
    "fastembed>=0.4.2",
    "langchain-aws>=0.2.0",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "fpdf2>=2.7.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_learning_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "N", "SIM", "C4"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

# httpx/starlette's TestClient type stubs are not fully inferable under strict
# mode (known upstream friction, not a project typing gap). Relaxed only for
# tests/; src/ stays fully strict.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

# asyncpg ships no py.typed marker and most of its public API (Pool.acquire,
# Connection.execute/fetch/fetchrow/transaction, asyncpg.connect, ...) has
# untyped parameters in its own source — a project-wide relaxation would
# weaken strictness for code that never touches it. Scoped to the two
# directories that talk to raw asyncpg directly; domain/ and application/
# only ever see our own typed ports and domain objects, and stay fully strict.
[[tool.pyright.executionEnvironments]]
root = "src/agentic_learning_platform/infrastructure"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[[tool.pyright.executionEnvironments]]
root = "src/agentic_learning_platform/routes"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
