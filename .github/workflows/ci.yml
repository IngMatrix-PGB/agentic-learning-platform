name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agentic_learning
          POSTGRES_PASSWORD: agentic_learning
          POSTGRES_DB: agentic_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentic_learning -d agentic_learning"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright (strict)
        run: uv run pyright

      - name: Pytest
        run: uv run pytest

  docker:
    name: Docker build (no publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agentic-learning-platform:ci .
